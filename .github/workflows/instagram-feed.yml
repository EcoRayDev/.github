name: Refresh Instagram profile feed

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-profile-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Fetch anonymous Instagram posts
        run: node scripts/fetch_instagram_posts.mjs --output "$RUNNER_TEMP/instagram-posts.json"

      - name: Update generated Instagram feed
        run: python3 scripts/update_instagram_feed.py --posts "$RUNNER_TEMP/instagram-posts.json"
      - name: Commit refreshed feed
        run: |
          git add profile/README.md profile/assets/instagram
          if git diff --cached --quiet; then
            echo "Instagram feed is unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(profile): refresh Instagram feed"
          git push origin HEAD:${{ github.event.repository.default_branch }}
